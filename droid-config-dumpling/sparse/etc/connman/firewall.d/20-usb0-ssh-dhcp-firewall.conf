# dumpling IPv4 USB developer connection: SSH and DHCP server requests.
# Phone path: /etc/connman/firewall.d/20-usb0-ssh-dhcp-firewall.conf
# General rules are explicitly restricted to usb0, which is not represented
# by the currently active ConnMan Wi-Fi/ethernet service rules.
# DHCP requests may originate at 0.0.0.0, so do not restrict their source subnet.

[General]
IPv4.INPUT.RULES = -i usb0 -p tcp -m tcp --dport 22 -j ACCEPT; -i usb0 -p udp -m udp --sport 68 --dport 67 -j ACCEPT
