# Direct binder RIL backend with the Qualcomm IMS extension.
# Slots: dual-sim.conf adds slot2 (/ril_1); slot1 (/ril_0) is defined here.
# radioInterface selects android.hardware.radio, not the QTI IMS version.

[Settings]
radioInterface = 1.1
extPlugin = qti
allowDataReq = on
useDataProfiles = true
deviceStateTracking = ds+if
# Avoid querying remaining PIN attempts by submitting an empty PIN.
emptyPinQuery = false

[slot1]
path = /ril_0
slot = 0
